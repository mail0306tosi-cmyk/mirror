<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>鏡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  #mirror {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    /* 左右反転（鏡）＋ほんの少しズームして広角の歪みを弱め、縦をわずかに縮めて顔の縦伸び感を補正 */
    transform: scale(-1.08, 1.04);
    transition: filter .6s ease;
  }
  #msg {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif; font-size: 18px;
    text-align: center; padding: 24px; line-height: 1.7;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<video id="mirror" autoplay playsinline muted></video>
<div id="msg">カメラを起動中…</div>
<script>
(async () => {
  const video = document.getElementById('mirror');
  const msg = document.getElementById('msg');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    msg.classList.add('hidden');
    startAutoBrightness(video);
  } catch (e) {
    msg.textContent = 'カメラを使えませんでした。ブラウザのカメラ許可を確認して、もう一度開いてみてね';
  }
})();

// 映像の平均の明るさを測って、明るすぎるときだけ自動で少し抑える
function startAutoBrightness(video) {
  const canvas = document.createElement('canvas');
  canvas.width = 32; canvas.height = 32;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let current = 1;
  setInterval(() => {
    if (video.readyState < 2 || !video.videoWidth) return;
    try {
      ctx.drawImage(video, 0, 0, 32, 32);
      const data = ctx.getImageData(0, 0, 32, 32).data;
      let sum = 0, n = 0;
      for (let i = 0; i < data.length; i += 16) {
        sum += 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
        n++;
      }
      const lum = sum / n; // 0〜255
      let target = 1;
      if (lum > 115) target = Math.min(1, Math.max(0.7, 118 / lum));
      current += (target - current) * 0.5;
      video.style.filter = 'brightness(' + current.toFixed(3) + ')';
    } catch (_) { /* 測れない環境では何もしない */ }
  }, 800);
}
</script>
</body>
</html>

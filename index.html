<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>鏡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  #mirror {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #msg {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: sans-serif; font-size: 18px;
    text-align: center; padding: 24px; line-height: 1.7;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<video id="mirror" autoplay playsinline muted></video>
<div id="msg">カメラを起動中…</div>
<script>
(async () => {
  const video = document.getElementById('mirror');
  const msg = document.getElementById('msg');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    msg.classList.add('hidden');
  } catch (e) {
    msg.textContent = 'カメラを使えませんでした。ブラウザのカメラ許可を確認して、もう一度開いてみてね';
  }
})();
</script>
</body>
</html>
